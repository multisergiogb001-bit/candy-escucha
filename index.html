
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071321">
<title>CANDY | Asistente personal</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px 14px;background:#071321;color:#eafaff;font-family:Arial,sans-serif}
main{max-width:600px;margin:20px auto;padding:25px;border:1px solid #164b66;border-radius:22px;background:#0d2032}
h1{text-align:center;color:#42d9ff;letter-spacing:7px;font-size:38px}
.sub{text-align:center;color:#b8cbd8}
.status{padding:14px;margin:20px 0;background:#102b40;border-radius:12px;text-align:center;color:#42d9ff}
input,textarea{width:100%;padding:14px;margin:8px 0;background:#071b2c;border:1px solid #24516a;border-radius:10px;color:white;font-size:16px}
textarea{min-height:85px;resize:vertical}
button{width:100%;padding:15px;margin:8px 0;border:0;border-radius:11px;background:#087fa5;color:white;font-size:15px;font-weight:bold}
button.secondary{background:#35495b}
button:disabled{opacity:.5}
#conversation{min-height:180px;max-height:400px;overflow:auto;padding:14px;background:#081a29;border:1px solid #24516a;border-radius:12px}
.message{margin:12px 0;line-height:1.5;overflow-wrap:anywhere}
.user{color:#b9eaff}
.candy{color:#42d9ff}
small{color:#8fa8ba}
</style>
</head>
<body>
<main>
<h1>CANDY</h1>
<p class="sub">Tu asistente personal inteligente</p>

<div class="status" id="status">Candy está preparada</div>

<label>Contraseña de acceso</label>
<input id="password" type="password" placeholder="Introduce tu contraseña de Candy" autocomplete="current-password">

<div id="conversation">
<div class="message candy">Candy: Hola. Estoy preparada para escucharte.</div>
</div>

<textarea id="message" placeholder="Escribe aquí o habla conmigo..."></textarea>

<button id="send">ENVIAR MENSAJE</button>
<button id="listen">🎙️ HABLAR CON CANDY</button>
<button id="stop" class="secondary">DETENER ESCUCHA</button>

<p class="sub"><small>La contraseña solo se conserva mientras esta página permanezca abierta. El micrófono se activa cuando tú lo solicitas.</small></p>
</main>

<script>
const WORKER_URL = "https://candy-puente.multisergiogb001.workers.dev";

const statusBox = document.getElementById("status");
const conversation = document.getElementById("conversation");
const messageBox = document.getElementById("message");
const passwordBox = document.getElementById("password");
const sendButton = document.getElementById("send");
const listenButton = document.getElementById("listen");
const stopButton = document.getElementById("stop");

let recognition = null;
let escuchando = false;
let procesando = false;

function estado(texto) {
  statusBox.textContent = texto;
}

function mostrar(quien, texto) {
  const div = document.createElement("div");
  div.className = "message " + (quien === "Tú" ? "user" : "candy");
  div.textContent = quien + ": " + texto;
  conversation.appendChild(div);
  conversation.scrollTop = conversation.scrollHeight;
}

async function llamarCandy(action, message) {
  const password = passwordBox.value.trim();

  if (!password) {
    estado("Introduce primero tu contraseña.");
    passwordBox.focus();
    throw new Error("Falta la contraseña de acceso.");
  }

  const response = await fetch(WORKER_URL, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      password: password,
      action: action,
      message: message
    })
  });

  const result = await response.json();

  if (!response.ok || result.error) {
    throw new Error(result.error || "Error de conexión.");
  }

  return result;
}

async function enviarMensaje(texto) {
  if (procesando) return;

  texto = (texto || "").trim();
  if (!texto) return;

  procesando = true;
  sendButton.disabled = true;
  mostrar("Tú", texto);
  estado("Candy está pensando...");

  try {
    const respuesta = await llamarCandy("chat", texto);

    if (!respuesta.text) throw new Error("Candy no ha devuelto texto.");

    mostrar("Candy", respuesta.text);
    estado("Candy ha respondido. Preparando su voz...");

    const voz = await llamarCandy("voice", respuesta.text);

    if (!voz.audio) throw new Error("No se ha recibido el audio.");

    const audio = new Audio("data:audio/mpeg;base64," + voz.audio);
    await audio.play();
    estado("Candy está hablando...");

    audio.onended = () => estado("Candy está preparada");

  } catch (error) {
    estado("Aviso: " + error.message);
  } finally {
    procesando = false;
    sendButton.disabled = false;
  }
}

sendButton.addEventListener("click", () => {
  const texto = messageBox.value.trim();
  if (!texto) return;
  messageBox.value = "";
  enviarMensaje(texto);
});

messageBox.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendButton.click();
  }
});

listenButton.addEventListener("click", () => {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    estado("Este navegador no admite reconocimiento de voz.");
    return;
  }

  if (escuchando) return;

  try {
    recognition = new SpeechRecognition();
    recognition.lang = "es-ES";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {
      escuchando = true;
      estado("Candy te está escuchando...");
    };

    recognition.onresult = event => {
      const texto = event.results[0][0].transcript;
      messageBox.value = texto;
      escuchando = false;
      enviarMensaje(texto);
    };

    recognition.onerror = event => {
      escuchando = false;
      estado("Error de micrófono: " + event.error);
    };

    recognition.onend = () => {
      escuchando = false;
    };

    recognition.start();

  } catch (error) {
    escuchando = false;
    estado("No se pudo iniciar el micrófono: " + error.message);
  }
});

stopButton.addEventListener("click", () => {
  if (recognition) recognition.stop();
  escuchando = false;
  estado("Escucha detenida.");
});
</script>
</body>
</html>
